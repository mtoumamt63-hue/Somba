name: Somba CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_and_test:
    name: Flutter Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies & Generate Code
        run: |
          flutter pub get
          flutter gen-l10n

      - name: 🔍 Static Code Analysis (flutter analyze)
        run: flutter analyze

      - name: 🧪 Run Automated Tests (flutter test)
        run: flutter test --coverage
